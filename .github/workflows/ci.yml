name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Sparebox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check chaos shell syntax
        run: |
          for f in containerlab/chaos/*.sh containerlab/chaos/benchmark/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Test chaos route parser and analyzer
        run: |
          python3 -m unittest discover \
            -s containerlab/chaos \
            -p 'test_route_parser.py' -v

      - name: Test Phase 3 bridge
        run: |
          python3 -m unittest discover \
            -s services/phase3-bridge \
            -p 'test_*.py' -v

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Check flake
        run: |
          nix flake check --show-trace

      - name: Evaluate NixOS configuration
        run: |
          nix eval --raw \
            .#nixosConfigurations.sparebox.config.system.build.toplevel.drvPath

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.8.1

      - name: Render Kubernetes manifests
        run: |
          kustomize build k8s/clusters/sparebox \
            > /tmp/sparebox-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp

          sudo install \
            -m 0755 \
            /tmp/kubeconform \
            /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            /tmp/sparebox-rendered.yaml

      - name: Install kube-linter
        run: |
          curl -fsSL \
            https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz \
            -o /tmp/kube-linter.tar.gz

          tar -xzf /tmp/kube-linter.tar.gz -C /tmp

          sudo install \
            -m 0755 \
            /tmp/kube-linter \
            /usr/local/bin/kube-linter

          kube-linter version

      - name: Lint Kubernetes manifests
        run: |
          kube-linter lint \
            --config .kube-linter/config.yaml \
            /tmp/sparebox-rendered.yaml
