all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    linux:
      hosts:
        clab-sparebox-fabric-ipsec-r1-1:
          ansible_host: 
        clab-sparebox-fabric-ipsec-r1-2:
          ansible_host: 
        clab-sparebox-fabric-ipsec-r2-1:
          ansible_host: 
        clab-sparebox-fabric-ipsec-r2-2:
          ansible_host: 
        clab-sparebox-fabric-ipsec-r3-1:
          ansible_host: 
        clab-sparebox-fabric-ipsec-r3-2:
          ansible_host: 
        clab-sparebox-fabric-r1-1:
          ansible_host: 172.20.20.5
        clab-sparebox-fabric-r1-2:
          ansible_host: 172.20.20.7
        clab-sparebox-fabric-r2-1:
          ansible_host: 172.20.20.3
        clab-sparebox-fabric-r2-2:
          ansible_host: 172.20.20.6
        clab-sparebox-fabric-r3-1:
          ansible_host: 172.20.20.4
        clab-sparebox-fabric-r3-2:
          ansible_host: 172.20.20.2