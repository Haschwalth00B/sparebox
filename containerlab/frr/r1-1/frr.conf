frr version 10.7
frr defaults traditional
hostname r1-1
log syslog informational
no ipv6 forwarding
!
interface lo
 ip address 10.0.1.1/32
!
interface eth1
 ip address 10.1.0.1/24
!
interface eth2
 ip address 10.31.0.2/30
!
router ospf
 network 10.0.1.1/32 area 0
 network 10.1.0.0/24 area 0
!
router bgp 65001
 no bgp ebgp-requires-policy
 bgp router-id 10.0.1.1
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.1.2 update-source lo
 neighbor 10.0.1.2 next-hop-self
 neighbor 10.31.0.1 remote-as 65003
 !
 address-family ipv4 unicast
  network 10.0.1.1/32
  neighbor 10.0.1.2 activate
  neighbor 10.31.0.1 activate
 exit-address-family
!
vrf CUST-A
!
interface CUST-A vrf CUST-A
 ip address 192.168.101.1/32
!
mpls ldp
 router-id 10.0.1.1
 !
 address-family ipv4
  discovery transport-address 10.0.1.1
  interface eth1
 exit-address-family
!
router bgp 65001 vrf CUST-A
 bgp router-id 10.0.1.1
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65001:100
  rt vpn both 65001:100
  export vpn
  import vpn
 exit-address-family
!
router bgp 65001
 address-family ipv4 vpn
  neighbor 10.0.1.2 activate
 exit-address-family
!
line vty
!
