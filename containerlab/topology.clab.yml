name: sparebox-fabric
topology:
  nodes:
    r1-1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r1-1/daemons:/etc/frr/daemons
        - frr/r1-1/frr.conf:/etc/frr/frr.conf
        - frr/r1-1/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - ip link add red type vrf table 10
        - ip link set red up
        - ip link add blue type vrf table 20
        - ip link set blue up
        - ip link add dummy-red type dummy
        - ip link set dummy-red master red
        - ip link set dummy-red up
        - ip link add dummy-blue type dummy
        - ip link set dummy-blue master blue
        - ip link set dummy-blue up
        - sysctl -w net.mpls.platform_labels=1048575
        - sysctl -w net.mpls.conf.red.input=1
        - sysctl -w net.mpls.conf.blue.input=1
    r1-2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r1-2/daemons:/etc/frr/daemons
        - frr/r1-2/frr.conf:/etc/frr/frr.conf
        - frr/r1-2/vtysh.conf:/etc/frr/vtysh.conf
