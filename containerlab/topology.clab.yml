name: sparebox-fabric

topology:
  nodes:
    r1-1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r1-1/daemons:/etc/frr/daemons
        - frr/r1-1/frr.conf:/etc/frr/frr.conf
    r1-2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r1-2/daemons:/etc/frr/daemons
        - frr/r1-2/frr.conf:/etc/frr/frr.conf
    r2-1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r2-1/daemons:/etc/frr/daemons
        - frr/r2-1/frr.conf:/etc/frr/frr.conf
    r2-2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r2-2/daemons:/etc/frr/daemons
        - frr/r2-2/frr.conf:/etc/frr/frr.conf
    r3-1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r3-1/daemons:/etc/frr/daemons
        - frr/r3-1/frr.conf:/etc/frr/frr.conf
    r3-2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.0
      binds:
        - frr/r3-2/daemons:/etc/frr/daemons
        - frr/r3-2/frr.conf:/etc/frr/frr.conf

    ipsec-r1-1:
      kind: linux
      image: local/strongswan:5.9
      network-mode: container:r1-1
      cap-add:
        - NET_ADMIN
      binds:
        - strongswan/r1-1/ipsec.conf:/etc/ipsec.conf
        - strongswan/r1-1/ipsec.secrets:/etc/ipsec.secrets
    ipsec-r1-2:
      kind: linux
      image: local/strongswan:5.9
      network-mode: container:r1-2
      cap-add:
        - NET_ADMIN
      binds:
        - strongswan/r1-2/ipsec.conf:/etc/ipsec.conf
        - strongswan/r1-2/ipsec.secrets:/etc/ipsec.secrets
    ipsec-r2-1:
      kind: linux
      image: local/strongswan:5.9
      network-mode: container:r2-1
      cap-add:
        - NET_ADMIN
      binds:
        - strongswan/r2-1/ipsec.conf:/etc/ipsec.conf
        - strongswan/r2-1/ipsec.secrets:/etc/ipsec.secrets
    ipsec-r2-2:
      kind: linux
      image: local/strongswan:5.9
      network-mode: container:r2-2
      cap-add:
        - NET_ADMIN
      binds:
        - strongswan/r2-2/ipsec.conf:/etc/ipsec.conf
        - strongswan/r2-2/ipsec.secrets:/etc/ipsec.secrets
    ipsec-r3-1:
      kind: linux
      image: local/strongswan:5.9
      network-mode: container:r3-1
      cap-add:
        - NET_ADMIN
      binds:
        - strongswan/r3-1/ipsec.conf:/etc/ipsec.conf
        - strongswan/r3-1/ipsec.secrets:/etc/ipsec.secrets
    ipsec-r3-2:
      kind: linux
      image: local/strongswan:5.9
      network-mode: container:r3-2
      cap-add:
        - NET_ADMIN
      binds:
        - strongswan/r3-2/ipsec.conf:/etc/ipsec.conf
        - strongswan/r3-2/ipsec.secrets:/etc/ipsec.secrets

  links:
    # intra-region OSPF links
    - endpoints: ["r1-1:eth1", "r1-2:eth1"]
    - endpoints: ["r2-1:eth1", "r2-2:eth1"]
    - endpoints: ["r3-1:eth1", "r3-2:eth1"]
    # inter-region eBGP + IPsec ring links
    - endpoints: ["r1-2:eth2", "r2-1:eth2"]
    - endpoints: ["r2-2:eth2", "r3-1:eth2"]
    - endpoints: ["r3-2:eth2", "r1-1:eth2"]

