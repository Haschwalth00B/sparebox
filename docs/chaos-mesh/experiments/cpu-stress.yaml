apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: sparebox-web-cpu-stress
  namespace: gitops-test
spec:
  mode: one
  duration: 30s
  selector:
    namespaces:
      - gitops-test
    labelSelectors:
      app: sparebox-web
  stressors:
    cpu:
      workers: 1
      load: 25
