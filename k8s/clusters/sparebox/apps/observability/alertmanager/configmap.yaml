apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by:
        - alertname
        - service
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: default
        discord_configs:
          - send_resolved: true
            webhook_url_file: /etc/alertmanager/secrets/webhook_url
