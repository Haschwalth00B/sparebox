apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by:
        - alertname
        - service
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: phase3-bridge
          matchers:
            - alertname="SpareboxLink12Degraded"
          continue: true

        - receiver: default
          matchers:
            - alertname=~".+"

    receivers:
      - name: default
        discord_configs:
          - send_resolved: true
            webhook_url_file: /etc/alertmanager/secrets/webhook_url

      - name: phase3-bridge
        webhook_configs:
          - url: http://127.0.0.1:8080/alerts
            send_resolved: false
