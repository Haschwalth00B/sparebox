apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      securityContext:
        fsGroup: 65534

      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1

          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            readOnlyRootFilesystem: true

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager

          ports:
            - name: http
              containerPort: 9093

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: discord-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager

      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: discord-secret
          secret:
            secretName: alertmanager-discord
            defaultMode: 0440
        - name: data
          emptyDir: {}
