apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase3-bridge
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: phase3-bridge
  template:
    metadata:
      labels:
        app: phase3-bridge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: docker.io/library/sparebox-phase3-bridge:0.1.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_HOST
              value: "127.0.0.1"
            - name: BRIDGE_PORT
              value: "8080"
            - name: VICTORIAMETRICS_URL
              value: "http://127.0.0.1:8428"
            - name: MAX_TELEMETRY_AGE_SECONDS
              value: "45"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
