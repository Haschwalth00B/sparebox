apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparebox-web
  namespace: gitops-test
  labels:
    app: sparebox-web
spec:
  replicas: invalid
  selector:
    matchLabels:
      app: sparebox-web
  template:
    metadata:
      labels:
        app: sparebox-web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: sparebox-web
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
